name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v0.1.0)"
        required: true
        default: v0.1.0
      prerelease:
        description: "Marquer comme préversion"
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    # Tauri ne se cross-compile pas raisonnablement vers Windows : la cible
    # MSVC et WebView2 imposent un runner Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # `tauri build` déclenche lui-même `beforeBuildCommand` (pnpm build),
      # qui typecheck puis construit le frontend.
      - name: Build de l'application
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Détermination du tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collecte des artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          base=src-tauri/target/x86_64-pc-windows-msvc/release

          # L'exécutable nu EST le portable : aucun DLL à côté, WebView2 étant
          # un composant système depuis Windows 10.
          cp "$base/RockYouGFX.exe" "dist-release/RockYouGFX-${{ steps.meta.outputs.tag }}-portable.exe"

          # L'installeur NSIS, dont le nom porte la version du tauri.conf.
          setup=$(find "$base/bundle/nsis" -name '*-setup.exe' | head -n 1)
          if [ -z "$setup" ]; then
            echo "::error::Installeur NSIS introuvable"
            exit 1
          fi
          cp "$setup" "dist-release/RockYouGFX-${{ steps.meta.outputs.tag }}-setup.exe"

          # Empreintes publiées avec la release : l'auto-update du portable les
          # compare au fichier téléchargé avant de remplacer quoi que ce soit.
          # Le glob se limite aux .exe pour ne pas se hacher soi-même.
          (cd dist-release && sha256sum *.exe > SHA256SUMS.txt)

          ls -la dist-release
          cat dist-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist-release/*

      - name: Publication de la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          flags=()
          [ '${{ steps.meta.outputs.prerelease }}' = 'true' ] && flags+=(--prerelease)

          cat > notes.md <<'NOTES'
          Éditeur de forme de minimap GTA V pour FiveM.

          ## Téléchargements

          | Fichier | Usage |
          | --- | --- |
          | `RockYouGFX-…-portable.exe` | Aucune installation. À placer dans un dossier vous appartenant, **pas** dans `Program Files` : la mise à jour automatique doit pouvoir y écrire. |
          | `RockYouGFX-…-setup.exe` | Installeur classique (NSIS), avec raccourcis et désinstallation. |
          | `SHA256SUMS.txt` | Empreintes, utilisées par la mise à jour automatique. |

          L'exécutable n'étant pas signé, Windows affichera « Windows a protégé
          votre ordinateur » : *Informations complémentaires* → *Exécuter quand même*.

          ## Ce que fait cette version

          L'éditeur de forme fonctionne sans aucun fichier du jeu : presets,
          rayon par coin, lissage continu de l'arc de cercle au squircle,
          adoucissement, bordure et modes HUD.

          L'export produit les masques, un `client.lua`, le `fxmanifest.lua` et
          une notice. Le `client.lua` masque les barres de vie et d'armure en
          appelant le Scaleform vanilla, ce qui évite d'avoir à modifier
          `minimap.gfx`.

          Depuis la v0.1.2, la version portable se met à jour toute seule. Une
          version antérieure ne le peut pas : un binaire ne contient que le code
          présent à son build.

          ## Ce qu'elle ne fait pas encore

          L'injection des masques dans `graphics.ytd` reste manuelle, via OpenIV
          ou CodeWalker. La marche à suivre est dans le `LISEZ-MOI.md` produit
          avec la resource.

          ## Rappel utile

          La forme du radar vient de la **luminance** de `radarmasksm` et
          `radarmasklg`, deux textures DXT1 logées dans `graphics.ytd`. Le
          `.gfx` ne porte que ce qui est dessiné par-dessus : bordure, barres,
          boussole. Ne remplacer que le `.gfx` ne change donc rien à la forme.
          NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-release/* --clobber
          else
            gh release create "$tag" dist-release/* \
              --title "RockYouGFX $tag" \
              --notes-file notes.md \
              "${flags[@]}"
          fi
